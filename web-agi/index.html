<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leisure Suit Larry in the Land of the Lounge Lizards</title>
    <meta
      name="description"
      content="Leisure Suit Larry 1 running in the browser on a Sierra AGI interpreter written from the original resource files."
    />
    <!-- The page's own colours, so the browser's chrome matches the shell
         rather than sitting in white above a dark page. Both are the --bg
         token in shell.ts; they are the one place it is spelled twice. -->

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120f" />
    <!-- Sixteen CGA-ish pixels of a monitor, inline so the page asks for no
         second file. -->

      rel="icon"

    />
